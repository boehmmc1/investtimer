<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>__TITEL__ · InvestTimer</title>
<style>
:root{--bg:#f8f8f3;--text:#1c2f2b;--sub:#5b6b66;--line:#dfe5dc;--accent:#2f6b5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:28px 20px 64px}
a{color:var(--accent);text-underline-offset:3px}
.zurueck{display:inline-flex;min-height:44px;align-items:center;font-size:14px;text-decoration:none}
h1{font-size:32px;line-height:1.25;letter-spacing:-.5px;margin:18px 0 8px}
@media(max-width:380px){h1{font-size:26px}}
h1,h2{overflow-wrap:break-word;hyphens:auto;text-wrap:balance}
h2{font-size:19px;line-height:1.35;margin:36px 0 8px}
h3{font-size:16px;margin:22px 0 4px}
p,li{color:var(--text)}
.klein{font-size:13px;color:var(--sub)}
mark{background:#fff1b8;padding:0 3px;border-radius:3px}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;display:flex;gap:20px;flex-wrap:wrap}
footer a{display:inline-flex;min-height:44px;align-items:center}
footer .fuss-hinweis{display:inline-flex;min-height:44px;align-items:center;color:var(--sub)}
</style>
</head>
