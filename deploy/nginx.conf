# investtimer.net – statische Seite + Ergebnisdatei
# HTTPS-Zeilen ergaenzt certbot selbst (deploy/cert.sh).
server {
    listen 80;
    listen [::]:80;
    server_name investtimer.net www.investtimer.net;

    root /var/www/investtimer/public;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/html application/json;

    location = /data/stress.json {
        alias /var/lib/investtimer/data/stress.json;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
