# investtimer.net – statische Seite + Ergebnisdatei
# HTTPS-Zeilen ergaenzt certbot selbst (deploy/cert.sh).
# Erste Bremse fuer den Chat: 12 Anfragen pro Minute und IP
# Apps (Capacitor): iOS capacitor://localhost, Android https://localhost
map $http_origin $it_app_origin {
    "capacitor://localhost" $http_origin;
    "https://localhost" $http_origin;
    default "";
}
# Lasttest: Quell-IPs in /etc/nginx/investtimer-lasttest.conf ("<ip> 1;") sind nur waehrend eines Lasttests von den Ratenlimits ausgenommen.
# Die Datei ist normalerweise leer (sonst greifen die Limits auch fuer den Server selbst, siehe tests/qa/sicherheit.py).
geo $it_lasttest {
    default 0;
    include /etc/nginx/investtimer-lasttest.conf;
}
map $it_lasttest $it_limit_key {
    1       "";
    default $binary_remote_addr;
}
limit_req_zone $it_limit_key zone=it_chat:1m rate=12r/m;
# Gleichzeitige Verbindungen je IP (gegen Missbrauch; Mobilfunk-NAT bleibt mit 60 grosszuegig bedient)
limit_conn_zone $it_limit_key zone=it_conn:5m;
# Micro-Cache fuer oeffentliche, fuer alle gleiche Antworten der API (Teilen-Seiten, Bild-Weiterleitung, oeffentlicher Verlauf)
proxy_cache_path /var/cache/nginx/investtimer levels=1:2 keys_zone=it_kurz:5m max_size=50m inactive=10m use_temp_path=off;
# Lese- und Kontopfade (Wert, Verlauf, Konto, Alarme): eigene Zone, damit normales Neuladen kein 429 ausloest
limit_req_zone $it_limit_key zone=it_api:1m rate=60r/m;
# Vorschaubild: Tagesdatum fuer den Dateinamen (Cache-Busting), siehe server/og_bild.py
map $time_iso8601 $it_og_tag {
    "~^(?<tag>\d{4}-\d{2}-\d{2})" $tag;
    default "aktuell";
}
# Ansichtswechsel (Nutzungsauswertung ohne Cookies): eigenes Protokoll ohne IP-Adresse
log_format it_ansicht '$time_iso8601 $arg_a $arg_l $arg_g';
# Statistik: eigenes Protokoll mit gekuerzter IP (IPv4 letztes Byte 0, IPv6 nur die ersten drei Bloecke)
map $remote_addr $it_ip_anon {
    "~^(?<a>\d+\.\d+\.\d+)\.\d+$" "$a.0";
    "~^(?<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "$b::";
    default "0.0.0.0";
}
log_format it_anon '$it_ip_anon [$time_iso8601] "$request_method $uri" $status "$http_referer" "$http_user_agent" "$http_accept_language"';

server {
    include snippets/investtimer-sicherheit.conf;
    server_name investtimer.net www.investtimer.net;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/investtimer-statistik.log it_anon;

    root /var/www/investtimer/public;
    index index.html;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 2;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json font/ttf;
    limit_conn it_conn 60;
    limit_conn_status 429;

    # Eigene 404-Seite, keine Versionsangabe von nginx
    server_tokens off;
    error_page 404 /404.html;

    location = /data/stress.json {
        include snippets/investtimer-sicherheit.conf;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        add_header Cache-Control "no-cache" always;
        alias /var/lib/investtimer/data/stress.json;
        default_type application/json;
    }

    # KI-Chat: gleiche Herkunft, dahinter die Volafly-API
    location = /api/chat {
        include snippets/investtimer-sicherheit.conf;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=it_chat burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/chat;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # Aktueller Marktstress nur mit Login-Token (oeffentlich gibt es /data/stress.json zeitversetzt)
    location = /api/aktuell {
        include snippets/investtimer-sicherheit.conf;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=it_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/aktuell;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Alarme und Web-Push (nur mit Login-Token, Pruefung in der API)
    location ~ ^/api/(alarme(/[0-9]+)?|push/(geraet|geraet-entfernen|test))$ {
        include snippets/investtimer-sicherheit.conf;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=it_api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/$1;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Konto und Abo (Login-Token bzw. Signatur werden in der API geprueft)
    location = /api/historie-oeffentlich {
        include snippets/investtimer-sicherheit.conf;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header X-Cache $upstream_cache_status always;
        limit_req zone=it_api burst=30 nodelay;
        limit_req_status 429;
        proxy_cache it_kurz;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/historie-oeffentlich;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/(historie|feedback|fehler|konto|konto/abgleich|konto/export|konto/loeschen|abo/checkout|abo/verwalten|abo/stripe-webhook|abo/revenuecat-webhook)$ {
        include snippets/investtimer-sicherheit.conf;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=it_api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/$1;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Kuendigen/Widerrufen ohne Login (§ 312k/§ 356a BGB), Pruefung und Limit in der API
    location ~ ^/api/(vertrag/kuendigen|vertrag/widerrufen)$ {
        include snippets/investtimer-sicherheit.conf;
        limit_req zone=it_chat burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/$1;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # E-Mail-Alarm abbestellen ohne Login (signierter Link, One-Click nach RFC 8058)
    location = /api/alarm-abmelden {
        include snippets/investtimer-sicherheit.conf;
        limit_req zone=it_chat burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/alarm-abmelden;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /media/: Film und Vorschaubild (fester Name) ein Tag, Range-Anfragen (Spulen);
    # Schriften und Bilder mit Inhalts-Hash im Namen ein Jahr, unveraenderlich (neue Fassung = neuer Name)
    location ^~ /media/ {
        include snippets/investtimer-sicherheit.conf;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Accept-Ranges "bytes" always;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        # TTF bekommt einen Schrift-Typ (statt application/octet-stream), damit gzip greift (165 KB -> ca. 80 KB)
        location ~ "^/media/[0-9a-f]{12}\.ttf$" {
            types { }
            default_type font/ttf;
            include snippets/investtimer-sicherheit.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin $it_app_origin always;
        }
        location ~ "^/media/[0-9a-f]{12}\.(woff2|ttf|svg|png|jpg)$" {
            include snippets/investtimer-sicherheit.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin $it_app_origin always;
        }
    }

    # Vorschaubild (taeglich erzeugt), Rueckfall auf das zuletzt erzeugte
    location ^~ /og/ {
        include snippets/investtimer-sicherheit.conf;
        root /var/lib/investtimer;
        try_files $uri /og/og-aktuell.png;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Teilen (Auftrag C, 20.11.2026): vorab gerenderte Bilder des zeitversetzten Stands (server/teilen_bilder.py, Timer investtimer-teilen)
    location ^~ /teilen/ {
        include snippets/investtimer-sicherheit.conf;
        root /var/lib/investtimer;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin $it_app_origin always;
        location = /teilen/aktuell/manifest.json {
            include snippets/investtimer-sicherheit.conf;
            root /var/lib/investtimer;
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin $it_app_origin always;
        }
    }
    location = /api/teilen/bild {
        include snippets/investtimer-sicherheit.conf;
        limit_req zone=it_api burst=30 nodelay;
        limit_req_status 429;
        proxy_cache it_kurz;
        proxy_cache_valid 302 60s;
        proxy_cache_lock on;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/teilen/bild;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    # Geteilte Links mit Link-Vorschau (og:/twitter:-Tags), leiten in die App weiter
    location ^~ /s/ {
        include snippets/investtimer-sicherheit.conf;
        limit_req zone=it_api burst=30 nodelay;
        limit_req_status 429;
        proxy_cache it_kurz;
        proxy_cache_valid 200 302 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        rewrite ^/s/(.*)$ /v1/investtimer/teilen/s/$1 break;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Statistik-Bericht: Adresse und Basic-Auth nur auf dem Server (/etc/nginx/investtimer-statistik.conf, nicht im Repo)
    include /etc/nginx/investtimer-statistik.conf;

    # Zaehlaufruf je Ansicht: ohne IP, ohne Kennung, eigenes Protokoll
    location = /api/v {
        include snippets/investtimer-sicherheit.conf;
        access_log /var/log/nginx/investtimer-ansichten.log it_ansicht;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Service Worker immer frisch
    location = /sw.js {
        include snippets/investtimer-sicherheit.conf;
        add_header Cache-Control "no-cache" always;
    }

    # VORSCHAU feature/ki-halbmond (voruebergehend). Entfernen: diesen Block loeschen, nginx -t, reload.
    location = /vorschau {
        return 301 /vorschau/;
    }
    location ^~ /vorschau/ {
        include snippets/investtimer-sicherheit.conf;
        alias /var/www/investtimer-vorschau/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }
    # /VORSCHAU

    location / {
        try_files $uri $uri/ =404;
        # Datum des Vorschaubilds in die Seite einsetzen (og:image)
        sub_filter '__OG_TAG__' $it_og_tag;
        sub_filter_once off;
    }

    location ~ /\. {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/investtimer.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/investtimer.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    include snippets/investtimer-sicherheit.conf;
    if ($host = www.investtimer.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = investtimer.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name investtimer.net www.investtimer.net;
    return 404; # managed by Certbot




}