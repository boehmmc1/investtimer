# investtimer.net – statische Seite + Ergebnisdatei
# HTTPS-Zeilen ergaenzt certbot selbst (deploy/cert.sh).
# Erste Bremse fuer den Chat: 12 Anfragen pro Minute und IP
# Apps (Capacitor): iOS capacitor://localhost, Android https://localhost
map $http_origin $it_app_origin {
    "capacitor://localhost" $http_origin;
    "https://localhost" $http_origin;
    default "";
}
limit_req_zone $binary_remote_addr zone=investtimer_chat:1m rate=12r/m;

server {
    server_name investtimer.net www.investtimer.net;

    root /var/www/investtimer/public;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/html application/json;

    # Eigene 404-Seite, keine Versionsangabe von nginx
    server_tokens off;
    error_page 404 /404.html;

    location = /data/stress.json {
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        alias /var/lib/investtimer/data/stress.json;
        default_type application/json;
    }

    # KI-Chat: gleiche Herkunft, dahinter die Volafly-API
    location = /api/chat {
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=investtimer_chat burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/chat;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # Aktueller Marktstress nur mit Login-Token (oeffentlich gibt es /data/stress.json zeitversetzt)
    location = /api/aktuell {
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=investtimer_chat burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/aktuell;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Alarme und Web-Push (nur mit Login-Token, Pruefung in der API)
    location ~ ^/api/(alarme(/[0-9]+)?|push/(geraet|geraet-entfernen|test))$ {
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=investtimer_chat burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/$1;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Konto und Abo (Login-Token bzw. Signatur werden in der API geprueft)
    location ~ ^/api/(historie|konto|konto/abgleich|konto/loeschen|abo/checkout|abo/verwalten|abo/stripe-webhook|abo/revenuecat-webhook)$ {
        add_header Access-Control-Allow-Origin $it_app_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=investtimer_chat burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/$1;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Kuendigen/Widerrufen ohne Login (§ 312k/§ 356a BGB), Pruefung und Limit in der API
    location ~ ^/api/(vertrag/kuendigen|vertrag/widerrufen)$ {
        limit_req zone=investtimer_chat burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/$1;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # E-Mail-Alarm abbestellen ohne Login (signierter Link, One-Click nach RFC 8058)
    location = /api/alarm-abmelden {
        limit_req zone=investtimer_chat burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8100/v1/investtimer/alarm-abmelden;
        proxy_set_header Host api.volafly.net;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Film, Vorschaubild und Schriften: eigene Dateien, Range-Anfragen (Spulen), 30 Tage Cache
    location ^~ /media/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Accept-Ranges "bytes" always;
        add_header Access-Control-Allow-Origin $it_app_origin always;
    }

    # Service Worker immer frisch
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # VORSCHAU feature/ki-halbmond (voruebergehend). Entfernen: diesen Block loeschen, nginx -t, reload.
    location = /vorschau {
        return 301 /vorschau/;
    }
    location ^~ /vorschau/ {
        alias /var/www/investtimer-vorschau/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }
    # /VORSCHAU

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/investtimer.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/investtimer.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.investtimer.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = investtimer.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name investtimer.net www.investtimer.net;
    return 404; # managed by Certbot




}