# InvestTimer: Sicherheits-Header (Gesamtprüfung 20.11.2026). Wird im server-Block und in jeder location mit eigenem
# add_header eingebunden, weil nginx 1.18 Header aus dem server-Block sonst nicht vererbt.
# Ablage auf dem Server: /etc/nginx/snippets/investtimer-sicherheit.conf
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://owcmsgroqhawcjlehcjk.supabase.co; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
