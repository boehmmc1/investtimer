<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8f3">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Seite nicht gefunden · InvestTimer</title>
<style>
:root{--bg:#f8f8f3;--text:#1c2f2b;--sub:#5b6b66;--line:#dfe5dc;--accent:#2f6b5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
main{max-width:560px;margin:0 auto;padding:72px 20px 64px}
h1{font-size:30px;line-height:1.25;letter-spacing:-.5px;margin:10px 0 8px}
p{margin:0 0 10px}
.en{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.en h2{font-size:19px;line-height:1.35;margin:0 0 6px}
a.knopf{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;margin-top:10px;border-radius:999px;background:var(--text);color:#fff;text-decoration:none;font-size:15px}
a.knopf:focus-visible,a:focus-visible{outline:2px solid #698dbc;outline-offset:3px}
a{color:var(--accent);text-underline-offset:3px}
a.leise{display:inline-flex;align-items:center;min-height:44px}
</style>
</head>
<body><main>
<h1>Diese Seite gibt es nicht.</h1>
<p>Vielleicht hat sich die Adresse geändert oder ein Tippfehler hat sich eingeschlichen.</p>
<a class="knopf" href="/">Zur Startseite</a>
<section class="en" lang="en">
<h2>Page not found.</h2>
<p>The address may have changed, or there may be a typo.</p>
<a class="leise" href="/">Go to the home page</a>
</section>
</main></body>
</html>
